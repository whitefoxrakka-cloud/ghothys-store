<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Orders - Ghothys Store</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .admin-shell{ max-width: 1200px; margin: 36px auto; padding: 0 16px; }
    .admin-topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px; }
    .admin-topbar h1{ font-size: 20px; color: var(--text-primary); margin:0; }
    .row{ display:flex; gap: 10px; flex-wrap:wrap; align-items:flex-end; margin: 12px 0; }
    input, select{
      padding: 10px 12px; border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-primary); color: var(--text-primary);
    }
    table{ width:100%; border-collapse: collapse; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; overflow:hidden; }
    thead th{ text-align:left; padding: 12px 12px; font-size: 13px; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); }
    tbody td{ padding: 12px 12px; border-bottom: 1px solid rgba(0,0,0,.05); font-weight: 700; color: var(--text-primary); }
    tbody tr:hover{ background: rgba(109,40,217,.06); }
    .btn{
      padding: 10px 14px; border-radius: 12px; border: none; font-weight: 900;
      background: var(--bg-card); color: var(--text-primary); box-shadow: var(--shadow);
      cursor:pointer;
    }
    .btn-primary{ background: #6d28d9; color:#fff; }
    .muted{ color: var(--text-secondary); font-weight: 700; font-size: 13px; }
    .pager{ display:flex; justify-content:space-between; align-items:center; margin-top: 14px; gap: 12px; flex-wrap:wrap; }
    .linkbtn{ cursor:pointer; text-decoration: underline; color: #6d28d9; font-weight: 900; }
    .spinner{ width: 14px; height: 14px; border: 2px solid rgba(0,0,0,.2); border-top-color: #6d28d9; border-radius: 999px; animation: spin .8s linear infinite; display:none; }
    @keyframes spin{ to{ transform: rotate(360deg);} }
    .select-wrap label{ display:block; font-size: 12px; color: var(--text-secondary); font-weight: 800; margin-bottom: 6px; }
    .pagination-size{ display:flex; gap: 10px; align-items:flex-end; flex-wrap:wrap; }
  </style>
</head>
<body>
  <div class="admin-shell">
    <div class="admin-topbar">
      <h1>GHOTHYS STORE • ADMIN ORDERS</h1>
      <div style="display:flex; gap:10px; align-items:center;">
        <button class="btn btn-primary" id="back-dashboard" type="button">Dashboard</button>
        <button class="btn" id="logout-btn" type="button">Logout</button>
      </div>
    </div>

    <div class="row">
      <div style="flex:1 1 240px;">
        <div class="select-wrap">
          <label>Search</label>
          <input id="search" type="text" placeholder="orderId / customerName / UID" />
        </div>
      </div>

      <div style="flex:0 0 160px;">
        <div class="select-wrap">
          <label>Status</label>
          <select id="status">
            <option value="">All</option>
            <option value="Pending">Pending</option>
            <option value="Diproses">Diproses</option>
            <option value="Success">Success</option>
            <option value="Cancel">Cancel</option>
          </select>
        </div>
      </div>

      <div style="flex:0 0 170px;">
        <div class="select-wrap">
          <label>Sort By</label>
          <select id="sortBy">
            <option value="created_at">Tanggal</option>
            <option value="price">Harga</option>
            <option value="game">Game</option>
            <option value="order_id">Order ID</option>
            <option value="customer_name">Customer</option>
            <option value="status">Status</option>
          </select>
        </div>
      </div>

      <div style="flex:0 0 140px;">
        <div class="select-wrap">
          <label>Sort</label>
          <select id="sortOrder">
            <option value="desc">Desc</option>
            <option value="asc">Asc</option>
          </select>
        </div>
      </div>

      <div class="pagination-size">
        <div class="select-wrap" style="min-width: 120px;">
          <label>Limit</label>
          <select id="limit">
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>
        <button class="btn btn-primary" id="apply-btn" type="button">Apply</button>
      </div>
    </div>

    <div class="muted" id="meta-text">—</div>

    <div style="margin-top: 10px;">
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>UID</th>
            <th>Game</th>
            <th>Harga</th>
            <th>Status</th>
            <th>Tanggal</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="orders-tbody"></tbody>
      </table>
    </div>

    <div class="pager">
      <button class="btn" id="prev-btn" type="button">Prev</button>
      <div class="muted" id="page-text">Page —</div>
      <button class="btn" id="next-btn" type="button">Next</button>
    </div>

  </div>

  <script src="../admin/js/admin-api.js"></script>
  <script src="../admin/js/orders.js"></script>
</body>
</html>
